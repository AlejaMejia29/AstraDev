<!doctype html>
<html class="dark" lang="es">
  <head>
    <meta charset="utf-8" />
    <script>
      (() => {
        const theme = localStorage.getItem('astra-theme') === 'light' ? 'light' : 'dark';
        const lang = localStorage.getItem('astra-lang') === 'en' ? 'en' : 'es';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.classList.toggle('light', theme === 'light');
        document.documentElement.lang = lang;
      })();
    </script>
    <title>AstraDev — Software e Inteligencia Artificial</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="brand/favicon.png" />
    <link rel="apple-touch-icon" href="brand/favicon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background font-body-md text-on-surface antialiased">
    <app-root></app-root>
  </body>
</html>
