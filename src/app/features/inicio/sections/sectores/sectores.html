<section id="sectores" class="w-full py-space-xl">
  <div class="mx-auto max-w-[1440px] px-margin-mobile md:px-margin-tablet lg:px-margin">
    <div appReveal class="mb-space-xl max-w-3xl">
      <span class="mb-space-xs block font-label-sm text-label-sm uppercase tracking-widest text-accent">
        {{ i18n.copy().sectors.eyebrow }}
      </span>
      <h2 class="mb-space-sm font-headline-lg text-headline-lg-mobile font-bold tracking-tight text-primary md:text-headline-lg">
        {{ i18n.copy().sectors.title }}
      </h2>
      <p class="font-body-lg text-body-lg text-on-surface-variant">
        {{ i18n.copy().sectors.intro }}
      </p>
    </div>

    <div class="grid grid-cols-1 gap-gutter sm:grid-cols-2 lg:grid-cols-3">
      @for (sector of i18n.copy().sectors.items; track sector.title; let i = $index) {
        <article
          appReveal
          [revealDelay]="i * 80"
          class="flex items-start gap-space-md rounded-lg bg-surface-container-low p-space-lg transition duration-300 ease-out hover:-translate-y-1 hover:bg-surface-container hover:shadow-[0_18px_40px_-28px_rgba(123,208,255,0.55)]"
        >
          <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded bg-surface-container text-accent">
            <span class="material-symbols-outlined">{{ sector.icon }}</span>
          </div>
          <div>
            <h3 class="mb-1 font-headline-sm text-headline-sm font-semibold text-primary">{{ sector.title }}</h3>
            <p class="font-body-md text-body-md text-on-surface-variant">{{ sector.description }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
