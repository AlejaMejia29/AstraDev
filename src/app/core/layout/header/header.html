<header
  class="fixed top-0 left-0 z-50 w-full bg-surface-dim/80 shadow-[0_1px_8px_rgba(0,0,0,0.4)] backdrop-blur-xl"
>
  <div
    class="mx-auto flex h-20 max-w-[1440px] items-center justify-between px-margin-mobile md:px-margin-tablet lg:px-margin"
  >
    <a class="flex items-center" routerLink="/" fragment="inicio" (click)="closeMenu()">
      <app-brand-logo class="sm:hidden" variant="mark" imgClass="h-9 w-auto" />
      <app-brand-logo class="hidden sm:block" variant="horizontal" imgClass="h-10 w-auto max-w-[220px] lg:max-w-[260px]" />
    </a>

    <nav class="hidden items-center gap-space-sm lg:flex">
      @for (link of links; track link.fragment) {
        <a
          class="px-space-sm py-space-xs font-label-md text-label-md uppercase tracking-wider text-on-surface-variant transition-colors hover:text-on-surface"
          routerLink="/"
          [fragment]="link.fragment"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="flex items-center gap-space-sm">
      <a
        class="inline-flex items-center justify-center rounded bg-primary px-space-md py-space-sm font-label-md text-label-md font-semibold uppercase text-on-primary transition-all hover:bg-primary-fixed hover:text-on-primary-fixed"
        routerLink="/"
        fragment="contacto"
        (click)="closeMenu()"
      >
        Cotizar
      </a>
      <button
        class="inline-flex h-10 w-10 items-center justify-center rounded bg-surface-container text-primary lg:hidden"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Abrir menú"
      >
        <span class="material-symbols-outlined">{{ menuOpen() ? 'close' : 'menu' }}</span>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav class="border-t border-outline-variant bg-surface-dim px-margin-mobile py-space-md lg:hidden">
      <div class="flex flex-col gap-space-xs">
        @for (link of links; track link.fragment) {
          <a
            class="rounded px-space-sm py-space-sm font-label-md text-label-md uppercase tracking-wider text-on-surface-variant hover:bg-surface-container hover:text-on-surface"
            routerLink="/"
            [fragment]="link.fragment"
            (click)="closeMenu()"
          >
            {{ link.label }}
          </a>
        }
      </div>
    </nav>
  }
</header>
